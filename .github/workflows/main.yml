
name: Build SIYOMA M-PESA & Call Tracker APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SIYOMA Android APKs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle-8.7-bin.zip

          unzip -q /tmp/gradle-8.7-bin.zip -d /opt

          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK environment is missing."
            exit 1
          fi

          echo "Android SDK: $SDK"

          command -v sdkmanager

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/platform-tools"

          echo "Installed SDK packages:"
          sdkmanager --list_installed

          echo "SUCCESS: Android SDK installation verified."

      - name: Verify Gradle installation
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/siyoma/mpesa/calltracker/MainActivity.java
          test -f app/src/main/java/com/siyoma/mpesa/calltracker/TrackerDb.java
          test -f app/src/main/java/com/siyoma/mpesa/calltracker/SyncEngine.java
          test -f app/src/main/java/com/siyoma/mpesa/calltracker/MpesaParser.java
          test -f app/src/main/java/com/siyoma/mpesa/calltracker/MpesaSmsReceiver.java

          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/drawable-nodpi/siyoma_mpesa_call_tracker_logo.png

          echo "SUCCESS: SIYOMA project structure verified."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK generated:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-MPESA-Call-Tracker-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Release APK generated:"
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-MPESA-Call-Tracker-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
