name: Build SIYOMA M-PESA & Call Tracker APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SIYOMA Android APKs
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. INSTALL GRADLE 8.7
      # ============================================================
      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle-8.7-bin.zip

          unzip -q \
            /tmp/gradle-8.7-bin.zip \
            -d /opt

          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

          echo "Gradle 8.7 installed successfully."


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK was not detected."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/platform-tools"

          echo "Android SDK verification successful."


      # ============================================================
      # 6. LOCATE AND EXTRACT ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          find_project() {
            local SEARCH_DIR="$1"

            while IFS= read -r SETTINGS; do

              local DIR
              DIR="$(dirname "$SETTINGS")"

              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                return 0

              fi

            done < <(
              find "$SEARCH_DIR" \
                -type d \( \
                  -name .git \
                  -o -name .gradle \
                  -o -name build \
                \) -prune \
                -o \
                -type f \( \
                  -name settings.gradle \
                  -o -name settings.gradle.kts \
                \) \
                -print
            )

            return 1
          }


          # ----------------------------------------------------------
          # First check for a normal project directly in repository
          # ----------------------------------------------------------
          if find_project "$GITHUB_WORKSPACE"; then

            echo "Android project found directly in repository."

          else

            echo "Android project not found directly."
            echo "Searching for Android project ZIP..."


            # --------------------------------------------------------
            # Find the project ZIP
            # --------------------------------------------------------
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              ! -name 'gradle-*.zip' \
              ! -path '*/.git/*' \
              -print | head -n 1)"


            if [ -z "$ZIP_FILE" ]; then

              echo "ERROR: No Android project ZIP found."

              echo ""
              echo "Repository contents:"
              find "$GITHUB_WORKSPACE" \
                -maxdepth 4 \
                -type f \
                -print

              exit 1

            fi


            echo ""
            echo "Android project ZIP found:"
            echo "$ZIP_FILE"


            # --------------------------------------------------------
            # Extract
            # --------------------------------------------------------
            rm -rf "$GITHUB_WORKSPACE/build-project"

            mkdir -p "$GITHUB_WORKSPACE/build-project"

            unzip -q \
              "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/build-project"


            # --------------------------------------------------------
            # Locate extracted project
            # --------------------------------------------------------
            if ! find_project "$GITHUB_WORKSPACE/build-project"; then

              echo "ERROR: ZIP does not contain a valid Android project."

              echo ""
              echo "Extracted contents:"
              find "$GITHUB_WORKSPACE/build-project" \
                -maxdepth 6 \
                -type f \
                -print

              exit 1

            fi

          fi


          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


          echo ""
          echo "================================================"
          echo "ANDROID PROJECT LOCATED"
          echo "================================================"
          echo "$PROJECT_DIR"
          echo "================================================"


      # ============================================================
      # 7. VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          echo "Checking Android project..."


          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then

            echo "ERROR: settings.gradle missing."
            exit 1

          fi


          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then

            echo "ERROR: app/build.gradle missing."
            exit 1

          fi


          if [ ! -f app/src/main/AndroidManifest.xml ]; then

            echo "ERROR: AndroidManifest.xml missing."
            exit 1

          fi


          if ! find app/src/main \
            -type f \
            \( -name '*.java' -o -name '*.kt' \) \
            -print -quit | grep -q .; then

            echo "ERROR: No Java/Kotlin source files found."
            exit 1

          fi


          echo ""
          echo "Android project files:"
          echo "------------------------------------------------"

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name 'AndroidManifest.xml' \
            \) \
            -print


          echo ""
          echo "Application source:"
          echo "------------------------------------------------"

          find app/src/main \
            -type f \
            \( -name '*.java' -o -name '*.kt' \) \
            -print


          echo ""
          echo "Project structure verified."


      # ============================================================
      # 8. VERIFY SIYOMA LOGO
      # ============================================================
      - name: Verify SIYOMA branding
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          LOGO_FOUND=0


          if [ -f \
            app/src/main/res/drawable-nodpi/siyoma_mpesa_call_tracker_logo.png
          ]; then

            LOGO_FOUND=1

          elif [ -f \
            app/src/main/res/drawable/siyoma_mpesa_call_tracker_logo.png
          ]; then

            LOGO_FOUND=1

          elif [ -f \
            branding/SIYOMA-MPESA-Call-Tracker-Approved-Logo.png
          ]; then

            LOGO_FOUND=1

          fi


          if [ "$LOGO_FOUND" -ne 1 ]; then

            echo "ERROR: SIYOMA approved logo was not found."

            find . \
              -type f \
              \( \
                -iname '*.png' \
                -o -iname '*.webp' \
                -o -iname '*.jpg' \
              \) \
              ! -path '*/build/*' \
              -print

            exit 1

          fi


          echo "SIYOMA approved logo found."


      # ============================================================
      # 9. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version


      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            clean


      # ============================================================
      # 11. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace


      # ============================================================
      # 12. VERIFY DEBUG APK
      # ============================================================
      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$BUILD_DIR/app/build/outputs/apk/debug"

          APK="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -print -quit 2>/dev/null || true)"


          if [ -z "$APK" ]; then

            echo "ERROR: Debug APK was not generated."

            find "$BUILD_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "DEBUG APK:"
          ls -lh "$APK"


      # ============================================================
      # 13. UPLOAD DEBUG APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-MPESA-Call-Tracker-Debug-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            assembleRelease \
            --stacktrace


      # ============================================================
      # 15. VERIFY RELEASE APK
      # ============================================================
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$BUILD_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -print -quit 2>/dev/null || true)"


          if [ -z "$APK" ]; then

            echo "ERROR: Release APK was not generated."

            find "$BUILD_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 16. UPLOAD RELEASE APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-MPESA-Call-Tracker-Release-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 17. FINAL BUILD SUMMARY
      # ============================================================
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "       SIYOMA M-PESA & CALL TRACKER"
          echo "================================================"
          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo ""
          echo "Debug APK:   GENERATED"
          echo "Release APK: GENERATED"
          echo ""
          echo "Both APKs have been uploaded as artifacts."
          echo ""
          echo "================================================"
