name: Build SIYOMA M-PESA & Call Tracker APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SIYOMA Android APKs
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. INSTALL GRADLE 8.7
      # ============================================================
      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle-8.7-bin.zip

          unzip -q /tmp/gradle-8.7-bin.zip -d /opt

          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

          echo "Gradle 8.7 installed."


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK was not detected."
            exit 1
          fi

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "ERROR: Android API 35 platform is missing."
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "ERROR: Android Build Tools 35.0.0 are missing."
            exit 1
          fi

          if [ ! -d "$SDK/platform-tools" ]; then
            echo "ERROR: Android Platform Tools are missing."
            exit 1
          fi

          echo "Android SDK verification successful."


      # ============================================================
      # 6. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          find_project() {
            local SEARCH_DIR="$1"

            while IFS= read -r SETTINGS; do
              local DIR
              DIR="$(dirname "$SETTINGS")"

              if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT_DIR="$DIR"
                return 0
              fi
            done < <(
              find "$SEARCH_DIR" \
                -type d \( \
                  -name .git \
                  -o -name .gradle \
                  -o -name build \
                \) -prune \
                -o \
                -type f \( \
                  -name settings.gradle \
                  -o -name settings.gradle.kts \
                \) \
                -print
            )

            return 1
          }


          # ----------------------------------------------------------
          # Look for a normal Android project first
          # ----------------------------------------------------------
          if find_project "$GITHUB_WORKSPACE"; then
            echo "Android project found directly in repository."

          else
            echo "Android project not found directly."
            echo "Searching for project ZIP..."


            # --------------------------------------------------------
            # Prefer the repaired project ZIP if present
            # --------------------------------------------------------
            ZIP_FILE=""

            REPAIRED_ZIP="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*Repaired*Ready*Android*Project*.zip' \
              ! -path '*/.git/*' \
              -print -quit || true)"

            if [ -n "$REPAIRED_ZIP" ]; then
              ZIP_FILE="$REPAIRED_ZIP"
            fi


            # --------------------------------------------------------
            # Otherwise select an Android project ZIP
            # --------------------------------------------------------
            if [ -z "$ZIP_FILE" ]; then

              ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.zip' \
                ! -name 'gradle-*.zip' \
                ! -path '*/.git/*' \
                -print | sort | head -n 1)"

            fi


            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project ZIP was found."

              echo ""
              echo "Repository files:"
              find "$GITHUB_WORKSPACE" \
                -maxdepth 5 \
                -type f \
                -print

              exit 1
            fi


            echo ""
            echo "Android project ZIP selected:"
            echo "$ZIP_FILE"


            # --------------------------------------------------------
            # Extract project
            # --------------------------------------------------------
            rm -rf "$GITHUB_WORKSPACE/build-project"

            mkdir -p "$GITHUB_WORKSPACE/build-project"

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/build-project"


            # --------------------------------------------------------
            # Locate extracted project
            # --------------------------------------------------------
            if ! find_project "$GITHUB_WORKSPACE/build-project"; then

              echo "ERROR: ZIP does not contain a valid Android Gradle project."

              echo ""
              echo "Extracted files:"
              find "$GITHUB_WORKSPACE/build-project" \
                -maxdepth 8 \
                -type f \
                -print

              exit 1
            fi

          fi


          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "================================================"
          echo "ANDROID PROJECT LOCATED"
          echo "================================================"
          echo "$PROJECT_DIR"
          echo "================================================"


      # ============================================================
      # 7. VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          echo "Checking Android project..."


          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file is missing."
            exit 1
          fi


          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: App Gradle file is missing."
            exit 1
          fi


          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml is missing."
            exit 1
          fi


          if ! find app/src/main -type f \( -name '*.java' -o -name '*.kt' \) -print -quit | grep -q .; then
            echo "ERROR: No Java/Kotlin source files were found."
            exit 1
          fi


          echo ""
          echo "Gradle files:"
          find . -maxdepth 5 -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print


          echo ""
          echo "Application source files:"
          find app/src/main -type f \( -name '*.java' -o -name '*.kt' \) -print


          echo ""
          echo "Android project structure verified."


      # ============================================================
      # 8. VERIFY SIYOMA BRANDING
      # ============================================================
      - name: Verify SIYOMA branding
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          LOGO_FOUND=0

          LOGO_1="app/src/main/res/drawable-nodpi/siyoma_mpesa_call_tracker_logo.png"
          LOGO_2="app/src/main/res/drawable/siyoma_mpesa_call_tracker_logo.png"
          LOGO_3="branding/SIYOMA-MPESA-Call-Tracker-Approved-Logo.png"


          if [ -f "$LOGO_1" ]; then
            LOGO_FOUND=1
            echo "Approved SIYOMA logo found:"
            echo "$LOGO_1"

          elif [ -f "$LOGO_2" ]; then
            LOGO_FOUND=1
            echo "Approved SIYOMA logo found:"
            echo "$LOGO_2"

          elif [ -f "$LOGO_3" ]; then
            LOGO_FOUND=1
            echo "Approved SIYOMA logo found:"
            echo "$LOGO_3"
          fi


          if [ "$LOGO_FOUND" -ne 1 ]; then

            echo "ERROR: Approved SIYOMA logo was not found."

            echo ""
            echo "Available image assets:"

            find . \
              -type f \
              \( \
                -iname '*.png' \
                -o -iname '*.webp' \
                -o -iname '*.jpg' \
                -o -iname '*.jpeg' \
              \) \
              ! -path '*/build/*' \
              -print

            exit 1
          fi


          echo ""
          echo "SUCCESS: Approved SIYOMA branding verified."


      # ============================================================
      # 9. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          gradle --version


      # ============================================================
      # 10. CLEAN PROJECT
      # ============================================================
      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            clean


      # ============================================================
      # 11. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace


      # ============================================================
      # 12. VERIFY DEBUG APK
      # ============================================================
      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$BUILD_DIR/app/build/outputs/apk/debug"

          APK="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -print -quit 2>/dev/null || true)"


          if [ -z "$APK" ]; then

            echo "ERROR: Debug APK was not generated."

            echo ""
            echo "Available build outputs:"

            find "$BUILD_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi


          echo ""
          echo "================================================"
          echo "DEBUG APK GENERATED"
          echo "================================================"

          ls -lh "$APK"

          echo "================================================"


      # ============================================================
      # 13. UPLOAD DEBUG APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-MPESA-Call-Tracker-Debug-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_DIR"

          gradle \
            --no-daemon \
            assembleRelease \
            --stacktrace


      # ============================================================
      # 15. VERIFY RELEASE APK
      # ============================================================
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$BUILD_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -print -quit 2>/dev/null || true)"


          if [ -z "$APK" ]; then

            echo "ERROR: Release APK was not generated."

            echo ""
            echo "Available build outputs:"

            find "$BUILD_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi


          echo ""
          echo "================================================"
          echo "RELEASE APK GENERATED"
          echo "================================================"

          ls -lh "$APK"

          echo "================================================"


      # ============================================================
      # 16. UPLOAD RELEASE APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-MPESA-Call-Tracker-Release-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 17. FINAL SUMMARY
      # ============================================================
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "       SIYOMA M-PESA & CALL TRACKER"
          echo "======================================================"
          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo ""
          echo "Debug APK:   GENERATED AND UPLOADED"
          echo "Release APK: GENERATED AND UPLOADED"
          echo ""
          echo "======================================================"
